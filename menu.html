<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitebox Cart</title>
    <script src="https://kit.fontawesome.com/92cde3f50d.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="css/Index.css">
</head>
<body>
    <HEADER>
        <naV>
            <DIV>
                <!-- logo -->
                 <img src="Image/Logo.png.png" alt="logo" width="180px">
                </div>
                <!-- menu -->
                  <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="Menu.html">Menu</a></li>
                    <li><a href="BiteDeals.html">Bite Deals</a></li>
                    <li><a href="Cart.html"><i class="fa-solid fa-cart-plus"></i>Cart</a></li>
                    <li><a href="Login.html"><i class="fa-solid fa-right-to-bracket"></i>Login</a></li>
                  </ul>
        </nav>
    </HEADER>
    <!-- start menu section -->

    <Section class="menu">
        <h2>Our Menu</h2>
        <div class="menu-container">
            <div class="card">
                <img src="Image/Burger .jpeg" alt="Burger" class="menu-image">
                <h3>Burger</h3>
                <p>Cheesy Burger</p>
                <span>₹199</span>
                <button>Add to Cart</button>

            </div>

            <div class="card">
             <img src="Image/pizza.png.png" alt="pizza" class="menu-image">   
             <h3>pizza</h3>
             <p>Cheesy pizza</p>
              <span>₹99</span>
              <button>add to cart</button>
            </div>

            <div class="card">
            <img src="Image/capsicum pizza.png.png" alt="capsicum pizza" class="menu-image">
            <h2>capsicum pizza</h2>
            <p>Delicious capsicum pizza</p>
            <span>₹149</span>
            <button>Add to Cart</button>
            </div>

            <div class="card">
            <img src="Image/white sause pasta.png.png" alt="white sause pasta" class="menu-image">
            <h2>white sause pasta</h2>
            <p>Delicious white sause pasta</p>
            <span>₹249</span>
            <button>add to Cart</button>
            </div>

            <div class="card">
                <img src="Image/french fires.png.png" alt="french fries" class="menu-image">
                <h2>french fries</h2>
                <p>cripy french fries</p>
                <span>₹99</span>
                <button>add to Cart</button>

            </div>

        </div>

    </Section>
    <!-- end menu section -->
</body>
</html>
